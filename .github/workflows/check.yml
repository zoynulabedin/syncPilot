name: Verify SyncPilot
on:
  pull_request:
  push:
    branches: [main, "codex/**", feat/syncpilot-foundation]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: syncpilot
          POSTGRES_PASSWORD: integration_only
          POSTGRES_DB: syncpilot
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U syncpilot" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://syncpilot:integration_only@localhost:5432/syncpilot?schema=public
      REDIS_URL: redis://localhost:6379
      SYNC_WRITE_ENABLED: "false"
      INVENTORY_WRITE_ENABLED: "false"
      SESSION_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install PostgreSQL 17 backup clients
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common ca-certificates
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm exec prisma validate
      - run: npm run setup
      - run: npm run check
      - run: npm run test:integration
      - run: npm run test:backup
      - run: npm run test:e2e
