services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: syncpilot
      POSTGRES_USER: syncpilot
      POSTGRES_PASSWORD: syncpilot_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - syncpilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncpilot -d syncpilot"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  syncpilot_pgdata:
